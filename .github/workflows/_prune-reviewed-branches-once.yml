name: One-time reviewed Myket branch cleanup

on:
  push:
    branches: [master]
    paths: [".github/workflows/_prune-reviewed-branches-once.yml"]

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    if: "${{ startsWith(github.event.head_commit.message, 'chore: prune reviewed Myket branches') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify merged PRs and delete only approved unchanged refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for number in 3 4 5; do
            test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq '.merged')" = true || {
              echo "PR #$number is not merged: preserving all branches"
              exit 1
            }
          done

          delete_unchanged() {
            local branch="$1"
            local expected="$2"
            local actual
            actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
            if [[ "$actual" != "$expected" ]]; then
              echo "Head changed: preserving $branch"
              return 0
            fi
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            echo "Deleted verified branch: $branch"
          }

          # Reviewed old diverged branches: their implementation was superseded
          # by the later mainline productization and safety releases. Exact
          # commit SHAs are pinned, so any new work is preserved.
          delete_unchanged 'productize-crawler' '7c6c0b68f39b053aa1bcd4e0f5b57379ee38a284'
          delete_unchanged 'live-smoke-hardening' '6225887da76872f53539f7ccf67dee065fd6b471'

          # Merged via reviewed PR #3, #4 and #5.
          delete_unchanged 'fix/myket-crawler-safety-20261101' '8ebcbbc2c9da9921b21dc8a12904559fef21f509'
          delete_unchanged 'feat/offline-myket-explorer-20261101' 'decbd335d0dc6153907600e72ef4b4065db65ee0'
          delete_unchanged 'fix/myket-audit-and-release-safety-20261102' '3ab76153606da4bec9fc6891461b62a2f5205514'
