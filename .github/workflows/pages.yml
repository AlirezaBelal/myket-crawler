name: GitHub Pages

on:
  push:
    branches: [master]
    paths: ['site/**', 'tests/test_product_site.mjs', '.github/workflows/pages.yml']
  pull_request:
    branches: [master]
    paths: ['site/**', 'tests/test_product_site.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the static product site
        run: node --test tests/test_product_site.mjs
      - name: Verify static publication files
        run: |
          test -f site/index.html
          test -f site/styles.css
          test -f site/assets/myket-mark.svg
          test -f site/assets/crawler-workflow.svg
          ! grep -Eiq '<script|<form|<iframe|fonts\.googleapis|googletagmanager' site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy static product website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published product site
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -eu
          test "$SITE_URL" = "https://alirezabelal.github.io/myket-crawler/"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 5 --max-time 30 "$SITE_URL" --output "$response_file"
          grep -Fq '<title>Myket Crawler — Local Android app research</title>' "$response_file"
          grep -Fq 'You run the crawler yourself.' "$response_file"
          for asset in styles.css assets/myket-mark.svg assets/crawler-workflow.svg; do
            curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 5 --max-time 30 "${SITE_URL}${asset}" --output /dev/null
          done
