name: GitHub Pages

on:
  push:
    branches: [master]
    paths: ['site/**', 'tests/test_product_site.mjs', '.github/workflows/pages.yml']
  pull_request:
    branches: [master]
    paths: ['site/**', 'tests/test_product_site.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the static product site
        run: node --test tests/test_product_site.mjs
      - name: Verify static publication files
        run: |
          test -f site/index.html
          test -f site/styles.css
          test -f site/assets/myket-mark.svg
          test -f site/assets/crawler-workflow.svg
          ! grep -Eiq '<script|<form|<iframe|fonts\.googleapis|googletagmanager' site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy static product website
        id: deployment
        uses: actions/deploy-pages@v4
