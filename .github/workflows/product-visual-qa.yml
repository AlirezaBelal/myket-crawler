name: Product visual QA
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser test tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve product website
        run: python3 -m http.server 8765 --directory site > /tmp/myket-site.log 2>&1 &
      - name: Test new product website and live portfolio
        run: node tests/product-visual-qa.mjs
      - name: Test production product website after release
        if: github.event_name != 'pull_request'
        env:
          PRODUCT_URL: https://alirezabelal.github.io/myket-crawler/
        run: |
          node tests/product-visual-qa.mjs
      - name: Preserve Chromium screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myket-product-visual-qa
          path: qa-evidence/
          retention-days: 14
