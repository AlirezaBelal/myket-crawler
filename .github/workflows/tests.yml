name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Run offline tests
        run: python -m unittest discover -s tests -v

  live-smoke:
    # Avoid crawling a third-party website on untrusted PR submissions.
    # Live checks remain available on the existing weekly schedule or by manual dispatch.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MYKET_PAGE_DELAY_MS: "600"
      MYKET_APP_DELAY_MS: "0"
      MYKET_PAGE_LOAD_TIMEOUT: "30"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run live Myket smoke crawl
        run: python tests/live_smoke.py --yes-live
