name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: unit-tests (${{ matrix.check_os || matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: "3.9"
            check_os: ubuntu-latest
          - os: windows-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Offline product CLI smoke (synthetic data only)
        run: |
          python src/main.py --demo --db artifacts/product-demo.db
          python src/main.py --db artifacts/product-demo.db --report artifacts/product-report.html
          python src/main.py --db artifacts/product-demo.db --export-csv artifacts/product-apps.csv

  live-smoke:
    # Avoid crawling a third-party website on untrusted PR submissions.
    # Live requests require a deliberate manual workflow dispatch; never run weekly or on PRs.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MYKET_PAGE_DELAY_MS: "600"
      MYKET_APP_DELAY_MS: "0"
      MYKET_PAGE_LOAD_TIMEOUT: "30"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run live Myket smoke crawl
        run: python tests/live_smoke.py --yes-live

